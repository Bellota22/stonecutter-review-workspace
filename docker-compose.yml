# Review workspace: http://localhost:3000
#
#   docker compose up --build     start (builds the image the first time)
#   docker compose restart        reopen the same saved decisions
#   docker compose down           stop, keep the review state volume
#   docker compose down -v        stop and start again from the bundled snapshot
services:
  workspace:
    build: .
    image: stonecutter-review-workspace
    init: true
    restart: unless-stopped
    environment:
      # Set ASSESSMENT_LATENCY_MS=800 to make the per-section loading states visible.
      ASSESSMENT_LATENCY_MS: ${ASSESSMENT_LATENCY_MS:-0}
    ports:
      - '3000:3000'
    volumes:
      - review-runtime:/app/.runtime

volumes:
  review-runtime:
